[project]
name = "aeeo"
version = "0.1.0"
description = "Autonomous Enterprise Engineering Organisation - multi-agent delivery workflow with human approval gates"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "ruff>=0.6",
    "bandit>=1.7",
    "pytest>=8",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["aeeo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["sample_repo"]
